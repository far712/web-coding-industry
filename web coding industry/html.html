
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Welcome to my Virtual Terrarium</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <div id="page">

        <h1>My Terrarium</h1>


<!-- Left plant panel -->
<div id="left-container" class="container">

    <div class="plant-holder">
        <img class="plant" alt="Plant 1"
             id="plant1" src="./images/plant1.png">
    </div>

    <div class="plant-holder">
        <img class="plant" alt="Plant 2"
             id="plant2" src="./images/plant2.png">
    </div>

    <div class="plant-holder">
        <img class="plant" alt="Plant 3"
             id="plant3" src="./images/plant3.png">
    </div>

    <div class="plant-holder">
        <img class="plant" alt="Plant 4"
             id="plant4" src="./images/plant4.png">
    </div>

</div>

<!-- Right plant panel -->
<div id="right-container" class="container">

    <div class="plant-holder">
        <img class="plant" alt="Plant 5"
             id="plant5" src="./images/plant5.png">
    </div>

    <div class="plant-holder">
        <img class="plant" alt="Plant 6"
             id="plant6" src="./images/plant6.png">
    </div>

    <div class="plant-holder">
        <img class="plant" alt="Plant 7"
             id="plant7" src="./images/plant7.png">
    </div>

</div>


        <!-- Terrarium jar -->
        <div id="terrarium">

            <div class="jar-top"></div>

            <div class="jar-walls">
                <div class="jar-glossy-long"></div>
                <div class="jar-glossy-short"></div>
            </div>

            <div class="dirt"></div>

            <div class="jar-bottom"></div>

        </div>

    </div>

</body>
</html>
